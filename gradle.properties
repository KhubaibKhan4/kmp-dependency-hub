kmphub.version=0.3.1

# ---- Publishing metadata (edit before the first release) --------------------------------------------
# GitHub repository the project lives in; used for the website, VCS links and the Gradle plugin id.
kmphub.githubOwner=KhubaibKhan4
kmphub.githubRepo=kmp-dependency-hub
# Shown on JetBrains Marketplace.
kmphub.vendorName=Khubaib Khan
kmphub.vendorUrl=https://github.com/KhubaibKhan4/kmp-dependency-hub
# Marketplace release channel: "default" (stable), or e.g. "eap" for pre-releases.
kmphub.marketplaceChannel=default

# IDE the idea-plugin compiles against when no local one is configured (CI). Set a local IDE in the
# git-ignored local.properties instead: kmphub.ideaLocalPath=/Applications/Android Studio.app
kmphub.ciPlatformVersion=2025.3

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.code.style=official
