name: Publish Gradle plugin

# Run from the Actions tab to publish the Gradle plugin on its own (no IDE build, no Marketplace).
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
    steps:
      - name: Require Plugin Portal keys
        if: env.GRADLE_PUBLISH_KEY == '' || env.GRADLE_PUBLISH_SECRET == ''
        run: |
          echo "::error::Set the GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET repository secrets first (see PUBLISHING.md)."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the engine and the Gradle plugin
        run: ./gradlew :core:test :gradle-plugin:test :gradle-plugin:validatePlugins -Pkmphub.skipIdea=true
      - name: Publish to Gradle Plugin Portal
        run: ./gradlew :gradle-plugin:publishPlugins -Pkmphub.skipIdea=true
