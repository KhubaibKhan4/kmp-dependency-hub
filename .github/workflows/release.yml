name: Release

# Push a tag like v0.3.1 (matching kmphub.version in gradle.properties) to publish.
# Each store publishes in its own job and skips itself while its secrets aren't configured.
on:
  push:
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Check tag matches version
        run: |
          VERSION=$(grep '^kmphub.version=' gradle.properties | cut -d= -f2)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match kmphub.version=$VERSION"; exit 1; }
      - name: Build, test and verify
        run: ./gradlew build :idea-plugin:verifyPlugin -Pkmphub.verifyRecommended=true

  marketplace:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
    steps:
      - name: Skip without Marketplace secrets
        if: env.PUBLISH_TOKEN == '' || env.PRIVATE_KEY == '' || env.CERTIFICATE_CHAIN == ''
        run: echo "::notice::Marketplace secrets not configured; skipping. See PUBLISHING.md."
      - uses: actions/checkout@v4
        if: env.PUBLISH_TOKEN != '' && env.PRIVATE_KEY != '' && env.CERTIFICATE_CHAIN != ''
      - uses: actions/setup-java@v4
        if: env.PUBLISH_TOKEN != '' && env.PRIVATE_KEY != '' && env.CERTIFICATE_CHAIN != ''
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        if: env.PUBLISH_TOKEN != '' && env.PRIVATE_KEY != '' && env.CERTIFICATE_CHAIN != ''
      - name: Sign and publish to JetBrains Marketplace
        if: env.PUBLISH_TOKEN != '' && env.PRIVATE_KEY != '' && env.CERTIFICATE_CHAIN != ''
        run: ./gradlew :idea-plugin:publishPlugin

  gradle-plugin-portal:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # Read by the plugin-publish plugin directly; never passed on the command line.
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
    steps:
      - name: Skip without Plugin Portal keys
        if: env.GRADLE_PUBLISH_KEY == '' || env.GRADLE_PUBLISH_SECRET == ''
        run: echo "::notice::Gradle Plugin Portal keys not configured; skipping. See PUBLISHING.md."
      - uses: actions/checkout@v4
        if: env.GRADLE_PUBLISH_KEY != '' && env.GRADLE_PUBLISH_SECRET != ''
      - uses: actions/setup-java@v4
        if: env.GRADLE_PUBLISH_KEY != '' && env.GRADLE_PUBLISH_SECRET != ''
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        if: env.GRADLE_PUBLISH_KEY != '' && env.GRADLE_PUBLISH_SECRET != ''
      - name: Publish to Gradle Plugin Portal
        if: env.GRADLE_PUBLISH_KEY != '' && env.GRADLE_PUBLISH_SECRET != ''
        run: ./gradlew :gradle-plugin:publishPlugins -Pkmphub.skipIdea=true

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the plugin zip (signed when the certificate is configured)
        run: ./gradlew :idea-plugin:buildPlugin :idea-plugin:signPlugin
      - name: GitHub release with the plugin zip
        uses: softprops/action-gh-release@v2
        with:
          files: idea-plugin/build/distributions/*.zip
          generate_release_notes: true
